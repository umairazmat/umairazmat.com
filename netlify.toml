[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# Next.js rewrites handled by plugin
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/next"
  status = 200

